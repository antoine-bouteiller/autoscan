name: Publish to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  quality-checks:
    name: Quality Checks
    secrets: inherit
    uses: ./.github/workflows/reusable-quality-checks.yaml

  deploy:
    name: Deploy to Docker Hub
    runs-on: ubuntu-latest
    needs: [quality-checks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: antobouteiller/autoscan:${{ github.sha }}, antobouteiller/autoscan:latest
          cache-from: type=registry,ref=antobouteiller/autoscan:buildcache
          cache-to: type=registry,ref=antobouteiller/autoscan:buildcache,mode=max
