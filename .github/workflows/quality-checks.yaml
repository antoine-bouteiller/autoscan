name: Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run linter
        run: vp check

  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      coverage-artifact: coverage-report
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache APT packages
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        id: apt-cache
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-ffmpeg

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --download-only ffmpeg
          sudo apt-get install -y ffmpeg

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run tests with coverage
        run: vp run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  nix-hash:
    name: Nix Hash
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update pnpmDeps hash
        run: bash scripts/update_nix_hash.sh

      - name: Commit and push updated hash
        run: |
          git diff --quiet flake.nix && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "chore: update nix pnpmDeps hash"
          git push

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run knip
        run: vp run knip
