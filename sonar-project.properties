sonar.projectKey=antoine-bouteiller_autoscan
sonar.organization=antoine-bouteiller

# Source directories
sonar.sources=src
sonar.tests=tests

# TypeScript specific settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=node_modules/**,coverage/**,dist/**,build/**
sonar.test.exclusions=tests/**

# Coverage exclusions
sonar.coverage.exclusions=tests/**,**/integrations/**,**/controllers/**,**/providers/**,**/config/**
