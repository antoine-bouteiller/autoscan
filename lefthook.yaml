commit-msg:
  commands:
    lint-commit-msg:
      run: bunx commitlint --edit
pre-commit:
  parallel: true
  jobs:
    - name: Check Lockfile
      run: bun install --frozen-lockfile --silent
    - name: Check
      glob: '*'
      run: bun run check {staged_files}
      stage_fixed: true
    - name: Update bun.nix
      glob: 'bun.lock'
      run: bunx bun2nix -o bun.nix
      stage_fixed: true
    - name: Knip
      run: bun run knip
