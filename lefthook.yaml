commit-msg:
  commands:
    lint-commit-msg:
      run: bunx --no -- commitlint --edit
pre-commit:
  parallel: true
  jobs:
    - name: Lint
      run: bunx lint {staged_files} --fix
      glob:
        - '*.js'
        - '*.jsx'
        - '*.ts'
        - '*.tsx'
        - '*.json'
        - '*.jsonc'
        - '*.css'
      stage_fixed: true
    - name: Format
      run: bunx prettier --write {staged_files}
      glob:
        - '*.js'
        - '*.jsx'
        - '*.ts'
        - '*.tsx'
        - '*.json'
        - '*.jsonc'
        - '*.css'
      stage_fixed: true
