commit-msg:
  commands:
    lint-commit-msg:
      run: bunx commitlint --edit
pre-commit:
  parallel: true
  jobs:
    - name: Check Lockfile
      run: bun install --frozen-lockfile --silent
    - name: Check
      glob: '*.{ts,js,mjs,cjs},!oxlint.config.ts,!oxfmt.config.ts'
      run: bunx oxlint --fix --fix-suggestions {staged_files}
      stage_fixed: true
    - name: Format
      exclude: '*.nix'
      run: bunx oxfmt {staged_files}
      stage_fixed: true
    - name: Format Nix
      glob: '*.nix'
      run: alejandra --quiet {staged_files}
      stage_fixed: true
    - name: Update bun.nix
      glob: 'bun.lock'
      run: bunx bun2nix -o bun.nix
      stage_fixed: true
    - name: Knip
      run: bun run knip
