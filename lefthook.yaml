commit-msg:
  jobs:
    - name: Lint Commit Message
      run: npx commitlint --edit
pre-commit:
  parallel: true
  jobs:
    - name: Check Lockfile
      run: pnpm i --frozen-lockfile
    - name: Lint
      glob: '*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx}'
      run: npx oxlint {staged_files} --fix
      stage_fixed: true
    - name: Format
      glob: '*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}'
      run: npx oxfmt {staged_files}
      stage_fixed: true
    - name: Type Check
      run: pnpm run typecheck
    - name: Knip
      run: pnpm run knip
